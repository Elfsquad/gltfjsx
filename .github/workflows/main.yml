name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      # Runtime dependencies only: they are what ships to consumers. Mirrors forge-convert-server.
      - run: yarn npm audit --environment production --recursive --severity moderate --no-deprecations
      - run: npm test
      - run: npm run test:scale

name: publish

# Publishes @elfsquad/gltfjsx to the org's GitHub Packages npm feed for a version tag: called by
# release-please.yml when its release PR is merged, or on a tag pushed by hand. Tag
# vMAJOR.MINOR.PATCH (e.g. v6.6.0); it must equal package.json's version with a leading "v",
# so what is published is exactly what the tagged commit says it is.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The version tag to publish, e.g. v6.6.0
        required: true
        type: string

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN publish to this org — no PAT needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          # Not .nvmrc: older tags, which this may publish again, predate it.
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elfsquad'

      - name: Tag matches package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi

      - name: Install
        run: corepack enable && yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: npm test

      # `prepack` runs the build, so the tarball always carries a fresh dist/.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
